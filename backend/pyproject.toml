[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "claralimaze",email = "clara.azevedo@gec.inatel.br"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
]
