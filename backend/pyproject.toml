[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "claralimaze",email = "clara.azevedo@gec.inatel.br"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)"
]

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "black (>=26.10.1,<27.0.0)"
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]