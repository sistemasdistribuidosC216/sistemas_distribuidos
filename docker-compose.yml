services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sd_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://sd_user:sd_password@db:5432/sd_database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sd_network

  db:
    image: postgres:16-alpine
    container_name: sd_database
    environment:
      - POSTGRES_USER=sd_user
      - POSTGRES_PASSWORD=sd_password
      - POSTGRES_DB=sd_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sd_user -d sd_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sd_network

volumes:
  postgres_data:

networks:
  sd_network:
    driver: bridge