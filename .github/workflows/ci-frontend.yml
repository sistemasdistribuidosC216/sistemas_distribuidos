name: CI - Frontend

on:
  push:
    branches:
      - projeto-final
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Formatacao (Biome)
        run: npm run format:check

      - name: Testes unitarios e de integracao (Vitest)
        run: npm run test

      - name: Build de producao
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (stack completa com Docker Compose)
        working-directory: .
        run: make e2e

      - name: Relatorio do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
