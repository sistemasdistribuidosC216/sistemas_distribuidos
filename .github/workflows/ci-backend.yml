name: CI - Backend

on:
  push:
    branches:
      - projeto-final
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  backend:
    name: Ruff, Black, Alembic e Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
          POSTGRES_DB: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas -d reservas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://reservas:reservas@localhost:5432/reservas

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        run: poetry install --no-interaction --no-ansi

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Formatacao (Black)
        run: poetry run black --check .

      - name: Aplicar migrations
        run: poetry run alembic upgrade head

      - name: Testes (Pytest)
        run: poetry run pytest -v
